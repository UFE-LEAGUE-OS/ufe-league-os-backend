services:
  backend:
    environment:
      USE_S3_MEDIA: "True"
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID in .env.storage}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY in .env.storage}
      S3_PUBLIC_BUCKET_NAME: ${S3_PUBLIC_BUCKET_NAME:-league-os-public}
      S3_PRIVATE_BUCKET_NAME: ${S3_PRIVATE_BUCKET_NAME:-league-os-private}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://object-storage:8333}
      S3_REGION_NAME: ${S3_REGION_NAME:-us-east-1}
      S3_ADDRESSING_STYLE: ${S3_ADDRESSING_STYLE:-path}
      S3_PUBLIC_CUSTOM_DOMAIN: ${S3_PUBLIC_CUSTOM_DOMAIN:-127.0.0.1:8333/league-os-public}
      S3_PUBLIC_URL_PROTOCOL: ${S3_PUBLIC_URL_PROTOCOL:-http:}
      S3_PRIVATE_URL_EXPIRY: ${S3_PRIVATE_URL_EXPIRY:-900}
      S3_MANAGE_BUCKET_POLICIES: ${S3_MANAGE_BUCKET_POLICIES:-True}
      S3_BOOTSTRAP_MAX_ATTEMPTS: ${S3_BOOTSTRAP_MAX_ATTEMPTS:-30}
      S3_BOOTSTRAP_RETRY_SECONDS: ${S3_BOOTSTRAP_RETRY_SECONDS:-2}
    command: >
      sh -c "python -m config.storage_bootstrap &&
             python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    depends_on:
      object_storage:
        condition: service_started

  object_storage:
    image: chrislusf/seaweedfs:4.39
    command:
      - mini
      - -dir=/data
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID in .env.storage}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY in .env.storage}
      S3_BUCKET: ${S3_PUBLIC_BUCKET_NAME:-league-os-public},${S3_PRIVATE_BUCKET_NAME:-league-os-private}
    ports:
      - "127.0.0.1:${S3_HOST_PORT:-8333}:8333"
    volumes:
      - league_os_object_storage_data:/data
    networks:
      default:
        aliases:
          - object-storage
    restart: unless-stopped
    mem_limit: 384m
    cpus: 0.50

volumes:
  league_os_object_storage_data:
