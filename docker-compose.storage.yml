services:
  object_storage:
    image: chrislusf/seaweedfs:4.39
    command:
      - mini
      - -dir=/data
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID in .env.storage}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY in .env.storage}
      S3_BUCKET: ${S3_BUCKETS:-league-os-public,league-os-private}
    ports:
      - "127.0.0.1:${S3_HOST_PORT:-8333}:8333"
    volumes:
      - league_os_object_storage_data:/data
    networks:
      default:
        aliases:
          - object-storage
    restart: unless-stopped
    mem_limit: 384m
    cpus: 0.50

volumes:
  league_os_object_storage_data:
