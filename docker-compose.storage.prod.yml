services:
  backend:
    environment:
      USE_S3_MEDIA: "True"
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID in .env.prod}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY in .env.prod}
      S3_PUBLIC_BUCKET_NAME: ${S3_PUBLIC_BUCKET_NAME:-league-os-public}
      S3_PRIVATE_BUCKET_NAME: ${S3_PRIVATE_BUCKET_NAME:-league-os-private}
      S3_ENDPOINT_URL: http://object-storage:8333
      S3_REGION_NAME: ${S3_REGION_NAME:-us-east-1}
      S3_ADDRESSING_STYLE: path
      S3_PUBLIC_CUSTOM_DOMAIN: ${S3_PUBLIC_CUSTOM_DOMAIN:?Set S3_PUBLIC_CUSTOM_DOMAIN in .env.prod}
      S3_PUBLIC_URL_PROTOCOL: ${S3_PUBLIC_URL_PROTOCOL:-https:}
      S3_PRIVATE_EXTERNAL_BASE_URL: ${S3_PRIVATE_EXTERNAL_BASE_URL:?Set S3_PRIVATE_EXTERNAL_BASE_URL in .env.prod}
      S3_PRIVATE_URL_EXPIRY: ${S3_PRIVATE_URL_EXPIRY:-900}
      S3_MANAGE_BUCKET_POLICIES: "True"
      S3_BOOTSTRAP_MAX_ATTEMPTS: ${S3_BOOTSTRAP_MAX_ATTEMPTS:-30}
      S3_BOOTSTRAP_RETRY_SECONDS: ${S3_BOOTSTRAP_RETRY_SECONDS:-2}
    command: >
      sh -c "python -m config.storage_bootstrap &&
             python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    depends_on:
      db:
        condition: service_healthy
      object_storage:
        condition: service_started

  frontend:
    depends_on:
      - backend
      - object_storage

  object_storage:
    image: chrislusf/seaweedfs:4.39
    container_name: league_os_prod_object_storage
    command:
      - mini
      - -dir=/data
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID in .env.prod}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY in .env.prod}
      S3_BUCKET: ${S3_PUBLIC_BUCKET_NAME:-league-os-public},${S3_PRIVATE_BUCKET_NAME:-league-os-private}
    expose:
      - "8333"
    volumes:
      - league_os_prod_object_storage_data:/data
    networks:
      default:
        aliases:
          - object-storage
    restart: unless-stopped
    mem_limit: 384m
    cpus: 0.50

volumes:
  league_os_prod_object_storage_data:
