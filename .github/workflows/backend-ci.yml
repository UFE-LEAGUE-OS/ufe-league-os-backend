name: Backend CI

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
  pull_request:
    branches:
      - main
      - develop

jobs:
  test-backend:
    name: Test Django Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: league_os
          POSTGRES_USER: league_os_user
          POSTGRES_PASSWORD: league_os_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U league_os_user -d league_os"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    env:
      DJANGO_SECRET_KEY: league-os-ci-secret-key-change-before-production-2026
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1

      DB_NAME: league_os
      DB_USER: league_os_user
      DB_PASSWORD: league_os_password
      DB_HOST: localhost
      DB_PORT: 5432

      POSTGRES_DB: league_os
      POSTGRES_USER: league_os_user
      POSTGRES_PASSWORD: league_os_password

      CORS_ALLOWED_ORIGINS: http://localhost:5173
      CSRF_TRUSTED_ORIGINS: http://localhost:5173

      EMAIL_BACKEND: django.core.mail.backends.console.EmailBackend
      DEFAULT_FROM_EMAIL: noreply@leagueos.local
      OTP_EXPIRY_MINUTES: 10
      OTP_MAX_ATTEMPTS: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django system check
        working-directory: backend
        run: python manage.py check

      - name: Check code formatting with Black
        working-directory: backend
        run: black --check .

      - name: Check code quality with Ruff
        working-directory: backend
        run: ruff check .

      - name: Check migrations
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run

      - name: Run backend tests
        working-directory: backend
        run: python manage.py test

      - name: Build backend Docker image
        run: docker build -t ufe-league-os-backend:test .